# Bouwt Sistreamans voor Android/Google TV, Windows en macOS en publiceert een release.
# De code staat in de privé-repo jphs93/sistreamans; deze openbare repo bevat alleen de downloads.
# Starten: tabblad Actions → "Nieuwe versie bouwen" → Run workflow (of via `gh workflow run`).
name: Nieuwe versie bouwen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versie (leeg = uit pubspec.yaml)"
        required: false
        default: ""
      notes:
        description: "Wat is er nieuw"
        required: false
        default: "Verbeteringen en reparaties."
      ref:
        description: "Branch of tag van de code"
        required: false
        default: "main"
      beta:
        description: "Bètaversie (Sistreamans Beta, naast de gewone app; alleen Android en macOS)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CODE_REPO: jphs93/sistreamans
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
      - id: v
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V=$(grep '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//'); fi
          echo "v=$V" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Signeersleutel
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: APK bouwen
        run: |
          set +e
          # Per processor-soort een eigen, veel kleinere APK (de app kiest zelf de juiste),
          # plus één universele voor de eerste installatie. Zelfde versiecode voor allemaal.
          # Debug-info apart (niet in de app): scheelt ruimte.
          ARGS="--release --build-name=${{ needs.version.outputs.v }} --build-number=$BUILD_NUMBER \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --split-debug-info=build/symbols -P force-version-code-ignoring-abi=true"
          if [ "${{ inputs.beta }}" = "true" ]; then ARGS="$ARGS --dart-define=BETA=true -Pbeta=true"; fi
          { flutter build apk $ARGS --split-per-abi && flutter build apk $ARGS; } 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # Foutregels als annotatie, zodat ze zonder logbestand te lezen zijn.
            grep -iE "error|what went wrong|exception|failed|> " build.log | grep -v "^Note:" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit $code
          fi
          set -e
          P=Sistreamans; if [ "${{ inputs.beta }}" = "true" ]; then P=Sistreamans-Beta; fi
          mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/$P-android.apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk dist/$P-android-$abi.apk
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  windows:
    needs: version
    if: ${{ !inputs.beta }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Windows-app bouwen
        shell: bash
        run: |
          flutter build windows --release \
            --build-name=${{ needs.version.outputs.v }} --build-number=$BUILD_NUMBER \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Installer maken
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.version.outputs.v }}" tool\windows_installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  macos:
    needs: version
    runs-on: macos-15-intel # arm64-servers zitten vaak vol; de app wordt toch universeel (Intel + Apple Silicon)
    # macOS-runners zijn soms overvol; dan gaat de release voor Android/Windows gewoon door.
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: "Bèta: eigen bundle-id (staat naast de gewone app)"
        if: ${{ inputs.beta }}
        run: sed -i '' 's/^PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = nl.sistreamans.sistreamans.beta/' macos/Runner/Configs/AppInfo.xcconfig
      - name: macOS-app bouwen
        run: |
          set -o pipefail
          BETA_ARG=""; if [ "${{ inputs.beta }}" = "true" ]; then BETA_ARG="--dart-define=BETA=true"; fi
          flutter build macos --release $BETA_ARG \
            --build-name=${{ needs.version.outputs.v }} --build-number=$BUILD_NUMBER \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} 2>&1 | tee build.log || { grep -iE "error|requires|deployment" build.log | grep -v "^warning" | tail -20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          mkdir -p dist
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ "${{ inputs.beta }}" = "true" ]; then
            mv "$APP" "build/macos/Build/Products/Release/Sistreamans Beta.app"
            ditto -c -k --keepParent "build/macos/Build/Products/Release/Sistreamans Beta.app" dist/Sistreamans-Beta-macos.zip
          else
            ditto -c -k --keepParent "$APP" dist/Sistreamans-macos.zip
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  release:
    needs: [version, android, windows, macos]
    if: ${{ !cancelled() && needs.android.result == 'success' && (inputs.beta || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: latest.json (hier kijkt de app naar)
        env:
          NOTES: ${{ inputs.notes }}
          BETA: ${{ inputs.beta }}
        run: |
          V="${{ needs.version.outputs.v }}"
          if [ "$BETA" = "true" ]; then TAG=beta; P=Sistreamans-Beta; else TAG="v$V"; P=Sistreamans; fi
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          python3 - <<PY
          import json, os
          dl = {
            "android": "$BASE/$P-android.apk",
            "android-armeabi-v7a": "$BASE/$P-android-armeabi-v7a.apk",
            "android-arm64-v8a": "$BASE/$P-android-arm64-v8a.apk",
            "android-x86_64": "$BASE/$P-android-x86_64.apk",
          }
          if os.path.exists("dist/Sistreamans-Setup.exe"):
            dl["windows"] = "$BASE/Sistreamans-Setup.exe"
          if os.path.exists("dist/$P-macos.zip"):
            dl["macos"] = "$BASE/$P-macos.zip"
          json.dump({
            "version": "$V",
            "build": int(os.environ["BUILD_NUMBER"]),
            "notes": os.environ.get("NOTES", ""),
            "downloads": dl,
          }, open("dist/latest.json", "w"), indent=2)
          PY
          ls -la dist
      # Bèta: één vaste pre-release "beta" die steeds wordt bijgewerkt (oude bestanden eerst weg).
      - name: Bèta-release leegmaken
        if: ${{ inputs.beta }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --yes --cleanup-tag -R ${{ github.repository }} || true
      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.beta }}
        with:
          tag_name: beta
          name: Sistreamans Beta ${{ needs.version.outputs.v }} (build ${{ github.run_number }})
          body: ${{ inputs.notes }}
          prerelease: true
          make_latest: "false"
          files: |
            dist/Sistreamans-Beta-android.apk
            dist/Sistreamans-Beta-android-armeabi-v7a.apk
            dist/Sistreamans-Beta-android-arm64-v8a.apk
            dist/Sistreamans-Beta-android-x86_64.apk
            dist/Sistreamans-Beta-macos.zip
            dist/latest.json
      - uses: softprops/action-gh-release@v2
        if: ${{ !inputs.beta }}
        with:
          tag_name: v${{ needs.version.outputs.v }}
          name: Sistreamans ${{ needs.version.outputs.v }}
          body: ${{ inputs.notes }}
          make_latest: "true"
          files: |
            dist/Sistreamans-android.apk
            dist/Sistreamans-android-armeabi-v7a.apk
            dist/Sistreamans-android-arm64-v8a.apk
            dist/Sistreamans-android-x86_64.apk
            dist/Sistreamans-Setup.exe
            dist/Sistreamans-macos.zip
            dist/latest.json
